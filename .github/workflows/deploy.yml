name: Build and Deploy Flask Application

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build, Push and Deploy
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        env:
          REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com
        run: |
          IMAGE_URI=$REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA

          docker build -t $IMAGE_URI ./application

          docker push $IMAGE_URI

          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

            - name: Deploy Application on EC2
        run: |
          REGISTRY=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com

          COMMANDS=$(cat <<EOF
          set -e
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$REGISTRY"
          docker pull "$IMAGE_URI"
          docker stop cloud-devops-container || true
          docker rm cloud-devops-container || true
          docker run -d --restart unless-stopped -p 5000:5000 --name cloud-devops-container "$IMAGE_URI"

          for i in {1..15}; do
            if curl -fsS http://127.0.0.1:5000/; then
              echo "Application health check passed!"
              exit 0
            fi
            echo "Waiting for Flask application..."
            sleep 3
          done

          echo "Application health check failed!"
          exit 1
          EOF
          )

          PARAMETERS=$(printf '%s\n' "$COMMANDS" | jq -R -s 'split("\n") | map(select(length > 0)) | {commands: .}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$PARAMETERS" \
            --region "$AWS_REGION" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for i in {1..60}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "Deployment status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              break
            fi

            if [[ "$STATUS" == "Failed" || "$STATUS" == "Cancelled" || "$STATUS" == "TimedOut" ]]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID" \
                --region "$AWS_REGION"
              exit 1
            fi

            sleep 5
          done

          if [ "$STATUS" != "Success" ]; then
            echo "Deployment timed out."
            exit 1
          fi

          echo "Application deployed successfully!"
